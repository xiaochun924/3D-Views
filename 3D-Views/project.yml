# XcodeGen 工程定义：在 3D-Views/ 目录执行 `xcodegen generate` 生成 .xcodeproj
#
# 这是工程的真源。CI 每次都会重新生成 .xcodeproj，并用下面的 info.properties
# 覆盖重写 Info.plist —— 所以改 Info.plist 必须改这里，否则改动会被构建时抹掉。
name: 3D-Views
options:
  bundleIdPrefix: com.xiaochun
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
packages:
  OCCTSwift:
    url: https://github.com/SecondMouseAU/OCCTSwift.git
    from: 3.0.0
targets:
  3D-Views:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - Models/STEP/**
          - Models/Mesh/**
          # 分享扩展是独立 target，它的源码不能混进主 App
          - 3D-Views-Share/**
          - 3D-Views.entitlements
          - 3D-Views-Share.entitlements
          # 工程定义本身不是资源。path: . 会把整个目录收进来，上一版就把它原样
          # 打进了已发布的 .app —— 解包可见 6553 字节的 project.yml 躺在根目录。
          - project.yml
    dependencies:
      - package: OCCTSwift
      # 分享扩展的嵌入被移除了。它一直在争同一次分享：Files 里点「分享」时，
      # 只要有 com.apple.share-services 扩展，系统就只运行扩展进程，而扩展**没有**
      # 「打开宿主 App」的正式能力 —— extensionContext.open 被系统拒绝（真机实测
      # 回调恒为 false），扩展又必须结束自己，于是每次都是「弹窗消失、什么也没发生」。
      #
      # 不嵌入扩展后，同一次分享改走系统原生的文档打开路径：「用其他应用打开」→
      # iOS 自己启动 App 并把文件拷进 Documents/Inbox。这一条在同一个人的
      # BatteryInsight（无扩展、只有 CFBundleDocumentTypes + LSSupportsOpeningDocumentsInPlace:false）
      # 上真机跑通过，也是本文件下面 CFBundleDocumentTypes 注释里照抄的来源。
      # 拉起 App 的是系统本身，不经过扩展，所以不存在被拒绝的问题。
      #
      # 扩展的 target 定义和源码都保留在下方（不再被嵌入），一条 `- target:` 就能恢复。
      # - target: 3D-Views-Share
      #   embed: true
    # App Group 是主 App 与分享扩展唯一能互相看见的地方。注意：IPA 以
    # CODE_SIGNING_ALLOWED=NO 构建，这份 entitlement 不会进包，必须由自签工具
    # 在签名时补上；否则 containerURL(forSecurityApplicationGroupIdentifier:)
    # 在真机上返回 nil，交接会静默失败（设置页会直接把这一点显示出来）。
    entitlements:
      path: 3D-Views.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ffcd1c12e1a9728e.1
    info:
      path: Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
          UIImageRespectsSafeAreaInsets: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: 3D Views
        CFBundleDevelopmentRegion: zh_CN
        UIFileSharingEnabled: true
        # 本项目最关键的一处开关。true 表示「本 App 有能力原地打开文档」，iOS 于是只递
        # 一个安全作用域 URL 过来，**不往 Documents/Inbox 拷任何东西**。真机诊断里
        # 「Documents/Inbox：目录不存在」正是这么来的：不是拷得慢，而是按设计就不会拷。
        # 偏偏那条 URL 通路在本项目上七轮都没被观察到真正交付过（scene 生命周期下它
        # 走 connectionOptions.urlContexts，而去碰那个入口会让应用启动即爆栈）。
        # 改成 false 后行为翻转：iOS 先把文件拷进 Documents/Inbox，再启动 App。即使 URL
        # 依旧递不到，importFromSandbox() 每次激活都会扫描并把文件捡走 —— 一条不依赖
        # URL 的保底通道。
        LSSupportsOpeningDocumentsInPlace: false
        # 分享扩展把文件放进 App Group 之后，用这个 scheme 尝试把主 App 拉到前台。
        # 分享扩展没有被赋予「打开宿主 App」的正式能力，所以这只是尽力而为；真正
        # 保证交接完成的是主 App 每次激活时扫描共享收件箱。
        CFBundleURLTypes:
          - CFBundleURLName: com.xiaochun.3DViews
            CFBundleURLSchemes:
              - 3dviews
        CFBundleDocumentTypes:
          # LSHandlerRank 全部改为 None，这是被真机实测逼出来的结论。
          #
          # Alternate 的语义是「我也能处理这个类型，但默认不是我」。系统据此把本 App
          # 视为该类型的**归属候选**，于是在分享时启用「文档打开」路径 —— 启动 App、
          # 把 URL 交给 scene 的 connectionOptions.urlContexts，**不往 Documents/Inbox
          # 拷任何东西**。而本 App 没有接管 scene（自定义 SceneDelegate 会让应用启动
          # 即爆栈，见 3D_ViewsApp.swift 里的记录），那个入口无人接收，URL 就此丢失。
          # 表现就是「App 跳转了，文件没进来」。
          #
          # 同一台设备上的对照实验给出了决定性证据：分享一个 .ipa —— 系统里没有任何
          # App 声明它，于是按通用类型处理，**拷进了 Documents/Inbox**，扫描直接看到；
          # 分享 .step —— 因为本 App 声明了 com.xiaochun.step，改走文档打开路径，
          # Documents/Inbox 里什么都没有。差别不在拷贝机制（同一个 App 上它明明是通的），
          # 而在这个「有主」声明把文件引到了另一条路上。
          #
          # None 让系统不再把该类型判为「有主」，从而回到与 .ipa 相同的通用投递行为：
          # 拷贝到 Documents/Inbox，再不依赖 URL 地被本 App 每次激活时扫到。
          - CFBundleTypeName: STEP CAD File
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            CFBundleTypeExtensions:
              - step
              - stp
            LSItemContentTypes:
              - com.xiaochun.step
          - CFBundleTypeName: STL Mesh
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            CFBundleTypeExtensions:
              - stl
            LSItemContentTypes:
              - com.xiaochun.stl
          # IGES 是 SolidWorks / Fusion 用户不额外花钱就能导出的通用格式。它和下面的
          # 原生 .sldprt 各管一段：IGES 是「另存为」那条路，.sldprt 是直接把文件拖进
          # 来那条路（App 自己把容器里内嵌的 Parasolid B-rep 转成 STEP）。
          - CFBundleTypeName: IGES CAD File
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            CFBundleTypeExtensions:
              - iges
              - igs
            LSItemContentTypes:
              - com.xiaochun.iges
          - CFBundleTypeName: OBJ Mesh
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            CFBundleTypeExtensions:
              - obj
            LSItemContentTypes:
              - com.xiaochun.obj
          # BREP 没有第二拼写：OCCT 自己的扩展名就这一个。
          - CFBundleTypeName: OCCT BREP File
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            CFBundleTypeExtensions:
              - brep
            LSItemContentTypes:
              - com.xiaochun.brep
          # SolidWorks 零件。原生 .sldprt 是私有容器，OpenCASCADE 读不了，但 App 自带
          # sldprt2step 的 Swift 移植（Models/SLDPRT/）：先从容器里取出内嵌的 Parasolid
          # XT B-rep，转成 STEP 文本，再交给 loadSTEP —— 面/边/顶点量测能力完整保留。
          - CFBundleTypeName: SolidWorks Part
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            CFBundleTypeExtensions:
              - sldprt
            LSItemContentTypes:
              - com.xiaochun.sldprt
          # 「Any Data File → public.data」这一条被删掉了，它很可能正是那条让投递
          # 静默失败的声明。`public.data` 是 UTI 树的根，所有文件都是它；声明它，
          # 等于让本 App 对系统说「任何文件我都能打开」。系统在决定把一个文件投给
          # 哪个 App 时（尤其是「拷贝到 Documents/Inbox 再启动」这条路径），面对
          # 一个声称通吃一切的候选会失去判定依据，结果是启动 App、却不交付任何东西
          # —— 真机表现正是「跳转成功、Documents/Inbox 不存在、URL 也没送达」。
          # 上面六个具体格式已完整覆盖此查看器认识的类型，兜底声明没有存在必要。
        UTExportedTypeDeclarations:
          # conformsTo 从 public.data 改成分得清的具体基础类型。public.data 是 UTI
          # 树的根，所有文件都符合它；一个只声明「我是任意数据」的类型，在系统眼里
          # 和别的文件没有任何区别，也就没有理由被优先投递给本 App。BatteryInsight
          # 那条真机跑通的声明用的是 public.plain-text（具体类型），不是根类型 ——
          # 这次照它改。
          # STEP / IGES / OBJ / BREP 都是纯文本格式（ISO 10303、ASME Y14.26M 等），
          # 归 public.text；STL 分 ASCII 与二进制两版、SLDPRT 是私有二进制容器，
          # 二者只能归 public.data。
          - UTTypeIdentifier: com.xiaochun.step
            UTTypeDescription: STEP CAD File
            UTTypeConformsTo:
              - public.text
            UTTypeTagSpecification:
              public.filename-extension:
                - step
                - stp
          - UTTypeIdentifier: com.xiaochun.stl
            UTTypeDescription: STL Mesh
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - stl
          - UTTypeIdentifier: com.xiaochun.iges
            UTTypeDescription: IGES CAD File
            UTTypeConformsTo:
              - public.text
            UTTypeTagSpecification:
              public.filename-extension:
                - iges
                - igs
          - UTTypeIdentifier: com.xiaochun.obj
            UTTypeDescription: OBJ Mesh
            UTTypeConformsTo:
              - public.text
            UTTypeTagSpecification:
              public.filename-extension:
                - obj
          - UTTypeIdentifier: com.xiaochun.brep
            UTTypeDescription: OCCT BREP File
            UTTypeConformsTo:
              - public.text
            UTTypeTagSpecification:
              public.filename-extension:
                - brep
          - UTTypeIdentifier: com.xiaochun.sldprt
            UTTypeDescription: SolidWorks Part
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - sldprt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaochun.3DViews
        PRODUCT_NAME: 3D-Views
        SWIFT_VERSION: "6.2"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""

  # 分享扩展的定义。**它不再被主 App 嵌入**（见上方 dependencies 的注释），因此
  # 打出来的包里不会有 .appex，「共享 → 到 3D Views」那一行也随之消失 —— 这正是
  # 重点：那一行曾经把每次分享都变成一次注定失败的扩展调用。
  #
  # 保留在这里是为了可回退：把主 target 的 `- target: 3D-Views-Share` / `embed: true`
  # 取消注释即可恢复。源码（3D-Views-Share/、Shared/）同样原样保留。
  3D-Views-Share:
    type: app-extension
    platform: iOS
    sources:
      - path: 3D-Views-Share
        excludes:
          - Info.plist
      - path: Shared
    entitlements:
      path: 3D-Views-Share.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ffcd1c12e1a9728e.1
    info:
      path: 3D-Views-Share/Info.plist
      properties:
        CFBundleDisplayName: 3D Views
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          # 与 ShareViewController.swift 里的 @objc(ShareViewController) 对应；
          # 用 Swift 的 mangled 名字在这里是找不到类的。
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
              # Files may expose a document as public.url / public.file-url.
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 0
              NSExtensionActivationSupportsMovieWithMaxCount: 0
              NSExtensionActivationSupportsText: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaochun.3DViews.Share
        PRODUCT_NAME: 3D-Views-Share
        SWIFT_VERSION: "6.2"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
