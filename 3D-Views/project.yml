# XcodeGen 工程定义：在 3D-Views/ 目录执行 `xcodegen generate` 生成 .xcodeproj
#
# 这是工程的真源。CI 每次都会重新生成 .xcodeproj，并用下面的 info.properties
# 覆盖重写 Info.plist —— 所以改 Info.plist 必须改这里，否则改动会被构建时抹掉。
name: 3D-Views
options:
  bundleIdPrefix: com.xiaochun
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
packages:
  OCCTSwift:
    url: https://github.com/SecondMouseAU/OCCTSwift.git
    from: 3.0.0
targets:
  3D-Views:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - Models/STEP/**
          - Models/Mesh/**
          # 分享扩展是独立 target，它的源码不能混进主 App
          - 3D-Views-Share/**
          - 3D-Views.entitlements
          - 3D-Views-Share.entitlements
          # 工程定义本身不是资源。path: . 会把整个目录收进来，上一版就把它原样
          # 打进了已发布的 .app —— 解包可见 6553 字节的 project.yml 躺在根目录。
          - project.yml
    dependencies:
      - package: OCCTSwift
      # 分享扩展重新被嵌入。这是用户明确要求回到的方案（原话：还要通过原先分享扩展
      # 导入方案），也是本文件里所有其他尝试都失败之后唯一还剩下的路。
      #
      # 中间试过的三条路，各自的结局都记录在这里，免得第四次再走一遍：
      #
      # 1) 不嵌入扩展、靠系统文档打开路径（BatteryInsight 的做法）。真机实测三组
      #    配置全是「App 跳转了、文件没进来」：Alternate+false 不拷也不递 URL；
      #    None+false 能把文件拷进 Documents/Inbox（用一个系统里无人声明的 .ipa
      #    验证过），代价是「文件」App 的「打开方式」列表里从此看不到本 App；
      #    Alternate+true 不拷、URL 也没到过 application(_:open:options:) 或
      #    .onOpenURL 任何一处。结论：本 App 没有接管 scene（自定义 SceneDelegate
      #    会让应用启动即爆栈），而文档打开路径的 URL 恰好只走 scene 的
      #    connectionOptions.urlContexts，那条路在本项目上是死的。
      #
      # 2) 因此重新走扩展：扩展自己把文件拷进 App Group 共享收件箱，主 App 每次
      #    激活扫描那个收件箱。**整条链路不依赖任何 URL 投递**，这正是它比文档打开
      #    路径可靠的地方 —— 文件是扩展亲手放的，不是系统答应给的。
      #
      # 3) 扩展里那个「打开 3D Views」按钮仍然保留，但它只是加速手段：点它能拉起
      #    主 App 就立即看到导入结果，拉不起来（系统拒绝 extensionContext.open）也
      #    没关系 —— 用户手动切回 App 同样会扫到文件。按钮不再是导入的前提。
      - target: 3D-Views-Share
        embed: true
    # App Group 是主 App 与分享扩展唯一能互相看见的地方。注意：IPA 以
    # CODE_SIGNING_ALLOWED=NO 构建，这份 entitlement 不会进包，必须由自签工具
    # 在签名时补上；否则 containerURL(forSecurityApplicationGroupIdentifier:)
    # 在真机上返回 nil，交接会静默失败（设置页会直接把这一点显示出来）。
    entitlements:
      path: 3D-Views.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ffcd1c12e1a9728e.1
    info:
      path: Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
          UIImageRespectsSafeAreaInsets: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: 3D Views
        CFBundleDevelopmentRegion: zh_CN
        UIFileSharingEnabled: true
        # 回到从未被真机证伪的那个组合：文件在「文件」App 里看得见我（Alternate），
        # 而我不原地打开（false）—— 后者配合扩展意味着系统会把文件拷一份给目标 App，
        # 正是扩展方案依赖的语义。真机实测过 Alternate+true，结果是既不拷也不递 URL，
        # 所以这个值必须回到 false。
        LSSupportsOpeningDocumentsInPlace: false
        # 分享扩展把文件放进 App Group 之后，用这个 scheme 尝试把主 App 拉到前台。
        # 分享扩展没有被赋予「打开宿主 App」的正式能力，所以这只是尽力而为；真正
        # 保证交接完成的是主 App 每次激活时扫描共享收件箱。
        CFBundleURLTypes:
          - CFBundleURLName: com.xiaochun.3DViews
            CFBundleURLSchemes:
              - 3dviews
        CFBundleDocumentTypes:
          # LSHandlerRank 保持在 Alternate：它唯一的作用是让本 App 出现在「文件」App
          # 的「打开方式」列表里，而这一点真机确认过（改 None 之后用户原话：
          # 「打开方式没有 3dviews了」）。扩展方案不依赖这条声明 —— 文件由扩展亲手
          # 拷进共享收件箱 —— 但保留它，用户从「打开方式」进来时至少能看到 App，
          # 而不是一个空的候选列表。
          #
          # 两个值都在真机上跑过的结论，记在这里免得再走一遍：
          #
          # None —— 系统不再把该类型判为「有主」，文件会走通用投递路径被拷进
          # Documents/Inbox（一个系统里无人声明的 .ipa 就是这么进来的），代价是
          # 「打开方式」列表里再也看不到本 App。能导入却找不到入口，不可取。
          #
          # Alternate —— 列表里看得到。此前与 LSSupportsOpeningDocumentsInPlace: false
          # 搭配时导入失败，但那不是这个值的问题：系统的文档打开路径只把 URL 递到
          # scene 的 connectionOptions.urlContexts，而本 App 没有接管 scene，
          # 那条路在本项目上根本走不通。扩展方案正是为了绕开它。
          - CFBundleTypeName: STEP CAD File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeExtensions:
              - step
              - stp
            LSItemContentTypes:
              - com.xiaochun.step
          - CFBundleTypeName: STL Mesh
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeExtensions:
              - stl
            LSItemContentTypes:
              - com.xiaochun.stl
          # IGES 是 SolidWorks / Fusion 用户不额外花钱就能导出的通用格式。它和下面的
          # 原生 .sldprt 各管一段：IGES 是「另存为」那条路，.sldprt 是直接把文件拖进
          # 来那条路（App 自己把容器里内嵌的 Parasolid B-rep 转成 STEP）。
          - CFBundleTypeName: IGES CAD File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeExtensions:
              - iges
              - igs
            LSItemContentTypes:
              - com.xiaochun.iges
          - CFBundleTypeName: OBJ Mesh
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeExtensions:
              - obj
            LSItemContentTypes:
              - com.xiaochun.obj
          # BREP 没有第二拼写：OCCT 自己的扩展名就这一个。
          - CFBundleTypeName: OCCT BREP File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeExtensions:
              - brep
            LSItemContentTypes:
              - com.xiaochun.brep
          # SolidWorks 零件。原生 .sldprt 是私有容器，OpenCASCADE 读不了，但 App 自带
          # sldprt2step 的 Swift 移植（Models/SLDPRT/）：先从容器里取出内嵌的 Parasolid
          # XT B-rep，转成 STEP 文本，再交给 loadSTEP —— 面/边/顶点量测能力完整保留。
          - CFBundleTypeName: SolidWorks Part
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeExtensions:
              - sldprt
            LSItemContentTypes:
              - com.xiaochun.sldprt
          # 「Any Data File → public.data」这一条被删掉了，它很可能正是那条让投递
          # 静默失败的声明。`public.data` 是 UTI 树的根，所有文件都是它；声明它，
          # 等于让本 App 对系统说「任何文件我都能打开」。系统在决定把一个文件投给
          # 哪个 App 时（尤其是「拷贝到 Documents/Inbox 再启动」这条路径），面对
          # 一个声称通吃一切的候选会失去判定依据，结果是启动 App、却不交付任何东西
          # —— 真机表现正是「跳转成功、Documents/Inbox 不存在、URL 也没送达」。
          # 上面六个具体格式已完整覆盖此查看器认识的类型，兜底声明没有存在必要。
        UTExportedTypeDeclarations:
          # conformsTo 从 public.data 改成分得清的具体基础类型。public.data 是 UTI
          # 树的根，所有文件都符合它；一个只声明「我是任意数据」的类型，在系统眼里
          # 和别的文件没有任何区别，也就没有理由被优先投递给本 App。BatteryInsight
          # 那条真机跑通的声明用的是 public.plain-text（具体类型），不是根类型 ——
          # 这次照它改。
          # STEP / IGES / OBJ / BREP 都是纯文本格式（ISO 10303、ASME Y14.26M 等），
          # 归 public.text；STL 分 ASCII 与二进制两版、SLDPRT 是私有二进制容器，
          # 二者只能归 public.data。
          - UTTypeIdentifier: com.xiaochun.step
            UTTypeDescription: STEP CAD File
            UTTypeConformsTo:
              - public.text
            UTTypeTagSpecification:
              public.filename-extension:
                - step
                - stp
          - UTTypeIdentifier: com.xiaochun.stl
            UTTypeDescription: STL Mesh
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - stl
          - UTTypeIdentifier: com.xiaochun.iges
            UTTypeDescription: IGES CAD File
            UTTypeConformsTo:
              - public.text
            UTTypeTagSpecification:
              public.filename-extension:
                - iges
                - igs
          - UTTypeIdentifier: com.xiaochun.obj
            UTTypeDescription: OBJ Mesh
            UTTypeConformsTo:
              - public.text
            UTTypeTagSpecification:
              public.filename-extension:
                - obj
          - UTTypeIdentifier: com.xiaochun.brep
            UTTypeDescription: OCCT BREP File
            UTTypeConformsTo:
              - public.text
            UTTypeTagSpecification:
              public.filename-extension:
                - brep
          - UTTypeIdentifier: com.xiaochun.sldprt
            UTTypeDescription: SolidWorks Part
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - sldprt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaochun.3DViews
        PRODUCT_NAME: 3D-Views
        SWIFT_VERSION: "6.2"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""

  # 分享扩展的定义。**它现在被主 App 嵌入了**（见上方 dependencies），打出来的包里
  # 会有 .appex，「共享 → 到 3D Views」那一行随之回来 —— 那是本方案唯一能让文件
  # 真正落到 App 手里的入口，其余三条路都在真机上走过并且都失败了。
  3D-Views-Share:
    type: app-extension
    platform: iOS
    sources:
      - path: 3D-Views-Share
        excludes:
          - Info.plist
      - path: Shared
    entitlements:
      path: 3D-Views-Share.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ffcd1c12e1a9728e.1
    info:
      path: 3D-Views-Share/Info.plist
      properties:
        CFBundleDisplayName: 3D Views
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          # 与 ShareViewController.swift 里的 @objc(ShareViewController) 对应；
          # 用 Swift 的 mangled 名字在这里是找不到类的。
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
              # Files may expose a document as public.url / public.file-url.
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 0
              NSExtensionActivationSupportsMovieWithMaxCount: 0
              NSExtensionActivationSupportsText: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaochun.3DViews.Share
        PRODUCT_NAME: 3D-Views-Share
        SWIFT_VERSION: "6.2"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
