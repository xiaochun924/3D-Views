name: 3D-Views

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: 3D-Views
  cancel-in-progress: false

jobs:
  build:
    name: 3D-Views
    runs-on: macos-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选 Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: 查看 Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i "ios" || true

      - name: 安装 XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate

      - name: 编译
        run: |
          set -o pipefail
          xcodebuild \
            -project 3D-Views.xcodeproj \
            -scheme 3D-Views \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee build_log.txt

      - name: 上传编译日志（失败时自动归档，便于诊断）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: warn
          retention-days: 7

      - name: 上报编译错误到 Issue（失败时，公开可见，免登录查看）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "## 编译失败日志（build_log.txt 末尾 100 行）" > body.md
          echo "" >> body.md
          tail -n 100 build_log.txt >> body.md 2>/dev/null || echo "（无日志文件）" >> body.md
          gh issue create --title "CI 编译失败 $(date -u +%m-%dT%H:%MZ)" --body-file body.md || true

      - name: 打包 IPA
        run: |
          APP=$(find build -type d -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "未找到 .app 产物"; exit 1
          fi
          echo "产物: $APP"
          rm -rf Payload && mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qr 3D-Views.ipa Payload
          ls -lh 3D-Views.ipa

      - name: 发布 IPA 到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA=3D-Views.ipa
          RELEASE_TAG="unsigned-ipa"
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" \
            --title "3D-Views" \
            --notes "自签版本" \
            "$IPA"

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Views-ipa
          path: 3D-Views.ipa
          if-no-files-found: error
          retention-days: 30
