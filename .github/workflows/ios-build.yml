name: 3D-Views Debug Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build 3D-Views
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: Install XcodeGen
        run: |
          set -euxo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        working-directory: 3D-Views
        run: xcodegen generate

      - name: Build and capture diagnostics
        working-directory: 3D-Views
        shell: bash
        run: |
          set -o pipefail
          rm -rf build build.log build.xcresult
          xcodebuild \
            -project 3D-Views.xcodeproj \
            -scheme 3D-Views \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            -resultBundlePath build.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY='' \
            clean build 2>&1 | tee build.log

      - name: Print compiler diagnostics on failure
        if: failure()
        working-directory: 3D-Views
        run: |
          echo '===== Swift/compiler diagnostics ====='
          grep -En 'error:|warning:|fatal error:|BUILD FAILED|BUILD SUCCEEDED' build.log || true
          echo '===== Last 300 log lines ====='
          tail -n 300 build.log || true

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics-${{ github.run_number }}
          path: |
            3D-Views/build.log
            3D-Views/build.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Package unsigned IPA
        if: success()
        working-directory: 3D-Views
        run: |
          set -euxo pipefail
          APP=$(find build -type d -name '*.app' | head -1)
          test -n "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr ../3D-Views-unsigned.ipa Payload

      - name: Upload unsigned IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Views-unsigned-ipa-${{ github.run_number }}
          path: 3D-Views-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish unsigned IPA release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unsigned-ipa
          name: 3D-Views unsigned IPA
          body: |
            自动构建的未签名 iOS IPA。

            Commit: ${{ github.sha }}
            Run: ${{ github.run_number }}
          files: 3D-Views-unsigned.ipa
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
